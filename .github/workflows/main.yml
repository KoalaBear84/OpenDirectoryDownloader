name: Continuous Integration

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    
    strategy:
      matrix:
        target: 
          - linux-x64
          - linux-arm
          - linux-arm64
          - win-x64
          - osx-x64
        self-contained:
          - normal
          - self-contained
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-latest
          - target: win-x64
            os: windows-latest
          - target: osx-x64
            os: macos-latest
          
          - self-contained: normal
            build_args: --no-self-contained
            suffix: ""
          - self-contained: self-contained
            build_args: --self-contained -p:PublishTrimmed=true -p:TrimMode=partial -p:EnableCompressionInSingleFile=true
            suffix: "-self-contained"

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Get version info
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
    - name: Restore with dotnet
      run: dotnet restore src/OpenDirectoryDownloader

    - name: Build with dotnet
      run: dotnet build src/OpenDirectoryDownloader --configuration Release -p:Version=${{ steps.get_version.outputs.VERSION }}

    - name: Test with dotnet
      # The tests do not depend on the publish target or packaging, so run them once per operating system
      # instead of in all ten matrix jobs. They live in their own project: pointing dotnet test at the app
      # project, as this step did, ran nothing at all.
      if: ${{ matrix.self-contained == 'normal' && contains(fromJSON('["linux-x64","win-x64","osx-x64"]'), matrix.target) }}
      run: dotnet test src/OpenDirectoryDownloader.Tests --configuration Release

    - name: Publish with dotnet
      run: dotnet publish src/OpenDirectoryDownloader --configuration Release -p:Version=${{ steps.get_version.outputs.VERSION }} --framework net10.0 --runtime ${{ matrix.target }} ${{ matrix.build_args }} -p:PublishSingleFile=true --output ./OpenDirectoryDownloader-${{ steps.get_version.outputs.VERSION }}-${{ matrix.target }}${{ matrix.suffix }}

    - name: Set executable bit (linux only)
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        chmod +x ./OpenDirectoryDownloader-${{ steps.get_version.outputs.VERSION }}-${{ matrix.target }}${{ matrix.suffix }}/OpenDirectoryDownloader

    - name: Zipping
      run: |
        7z a OpenDirectoryDownloader-${{ steps.get_version.outputs.VERSION }}-${{ matrix.target }}${{ matrix.suffix }}.zip ./OpenDirectoryDownloader-${{ steps.get_version.outputs.VERSION }}-${{ matrix.target }}${{ matrix.suffix }}/*
        # 7z is installed in all environments and supports unix permissions while compressing (but not while decompressing!)

    - name: Upload artifact for docker job (linux only)
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.self-contained == 'normal' }}
      uses: actions/upload-artifact@v4
      with:
        name: build-artifact-${{ matrix.target }}${{ matrix.suffix }}-docker
        path: |
          OpenDirectoryDownloader-${{ steps.get_version.outputs.VERSION }}-${{ matrix.target }}${{ matrix.suffix }}.zip
          src/Dockerfile
        overwrite: true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifact-${{ matrix.target }}${{ matrix.suffix }}
        path: |
          OpenDirectoryDownloader-${{ steps.get_version.outputs.VERSION }}-${{ matrix.target }}${{ matrix.suffix }}.zip
        overwrite: true

  release:
    needs: [ build ]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: build-artifacts
        pattern: build-artifact-*
        merge-multiple: true

    - name: Get tag info
      id: tag_info
      run: echo "SOURCE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Prepare release notes
      # The notes for a release are the file release-notes/<tag>.md (for example release-notes/v4.1.0.0.md),
      # committed before the tag is pushed. Without that file the commit message is used, as before.
      env:
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        SOURCE_TAG: ${{ steps.tag_info.outputs.SOURCE_TAG }}
      run: |
        NOTES_FILE="release-notes/${SOURCE_TAG}.md"
        if [ -f "$NOTES_FILE" ]; then
          echo "Using $NOTES_FILE as the release notes"
          cp "$NOTES_FILE" release-body.md
        else
          echo "No $NOTES_FILE found, using the commit message as the release notes"
          printf '%s\n' "$COMMIT_MESSAGE" > release-body.md
        fi

    - name: Create release
      # Created as a draft, which sends no notification. The publish job below makes it public once the
      # Docker images are out too, so the release email goes out once, with the final notes.
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag_info.outputs.SOURCE_TAG }}
        name: OpenDirectoryDownloader ${{ steps.tag_info.outputs.SOURCE_TAG }}
        draft: true
        prerelease: false
        body_path: release-body.md
        files: |
          build-artifacts/OpenDirectoryDownloader-*.zip


  docker:
    needs: [ build ]

    strategy:
      matrix:
        target: 
          - linux-x64
          - linux-arm
          - linux-arm64
        include:
          - target: linux-x64
            platform: linux/amd64
          - target: linux-arm
            platform: linux/arm/v7
          - target: linux-arm64
            platform: linux/arm64

    runs-on: ubuntu-latest
    steps:
      - name: Get version info
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set lowercase repository owner
        id: repo_owner
        run: echo "REPO_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: build-artifacts
          pattern: build-artifact-*
          merge-multiple: true

      - name: Decompress artifact
        run: unzip -qq ./build-artifacts/OpenDirectoryDownloader-${{ steps.get_version.outputs.VERSION }}-${{ matrix.target }}.zip -d ./app

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v1 
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build-artifacts/src/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/opendirectorydownloader:${{ matrix.target }}
            ghcr.io/${{ steps.repo_owner.outputs.REPO_OWNER_LC }}/opendirectorydownloader:${{ matrix.target }}

  combine:
    needs: [ docker ]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get tag info
        id: tag_info
        run: echo "SOURCE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set lowercase repository owner
        id: repo_owner
        run: echo "REPO_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Combine images for Docker Hub
        run: >
          docker buildx imagetools create
          -t ${{ secrets.DOCKERHUB_USERNAME }}/opendirectorydownloader:latest
          -t ${{ secrets.DOCKERHUB_USERNAME }}/opendirectorydownloader:${{ steps.tag_info.outputs.SOURCE_TAG }}
          ${{ secrets.DOCKERHUB_USERNAME }}/opendirectorydownloader:linux-x64
          ${{ secrets.DOCKERHUB_USERNAME }}/opendirectorydownloader:linux-arm
          ${{ secrets.DOCKERHUB_USERNAME }}/opendirectorydownloader:linux-arm64

      - name: Combine images for GitHub Container Registry
        run: >
          docker buildx imagetools create
          -t ghcr.io/${{ steps.repo_owner.outputs.REPO_OWNER_LC }}/opendirectorydownloader:latest
          -t ghcr.io/${{ steps.repo_owner.outputs.REPO_OWNER_LC }}/opendirectorydownloader:${{ steps.tag_info.outputs.SOURCE_TAG }}
          ghcr.io/${{ steps.repo_owner.outputs.REPO_OWNER_LC }}/opendirectorydownloader:linux-x64
          ghcr.io/${{ steps.repo_owner.outputs.REPO_OWNER_LC }}/opendirectorydownloader:linux-arm
          ghcr.io/${{ steps.repo_owner.outputs.REPO_OWNER_LC }}/opendirectorydownloader:linux-arm64

  publish:
    # Publishing is what sends the release email, so it waits for everything the release mentions: the zip files
    # (release) and the Docker images (docker, combine). If any of those fails the release stays a draft.
    needs: [ release, docker, combine ]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Publish the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release edit "${GITHUB_REF#refs/tags/}" --repo "$GITHUB_REPOSITORY" --draft=false
