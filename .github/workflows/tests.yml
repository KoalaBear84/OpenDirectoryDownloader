name: Tests

# Runs the unit and integration tests on every push to master and every pull request, on all three operating
# systems the app is released for. (The release workflow in main.yml only runs on version tags.)
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Test with dotnet
      # Release, like the published builds. The load tests are skipped unless ODD_LOAD_TESTS=1.
      run: dotnet test src/OpenDirectoryDownloader.Tests --configuration Release
